name: build

on:
  push:
  pull_request:

env:
  LIBQORIQ_RCW_REF: main

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libjson-c-dev

      - name: Install libqoriq-rcw from the source
        run: |
          sudo apt-get install -y git meson ninja-build pkg-config libmcpp-dev
          git clone --depth 1 --branch "$LIBQORIQ_RCW_REF" https://github.com/vjardin/libqoriq-rcw "$RUNNER_TEMP/libqoriq-rcw"
          meson setup "$RUNNER_TEMP/libqoriq-rcw/build" "$RUNNER_TEMP/libqoriq-rcw" --prefix=/usr/local --libdir=lib -Dtests=false -Dman=disabled
          sudo meson install -C "$RUNNER_TEMP/libqoriq-rcw/build"
          sudo ldconfig

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          openssl version
          pkg-config --modversion libqoriq-rcw

      - name: Build
        run: make

      - name: Smoke test
        run: tests/smoke.sh

      - name: Verification test
        run: tests/verify.sh

      - name: Install
        run: |
          make install DESTDIR=$RUNNER_TEMP/inst
          ls $RUNNER_TEMP/inst/usr/bin/cst

  build-openssl1:
    name: ubuntu-20.04 (OpenSSL 1.1)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libssl-dev libjson-c-dev git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          openssl version

      - name: Build
        run: make

      - name: Smoke test
        run: tests/smoke.sh

      - name: Verification test
        run: tests/verify.sh

  build-openssl4:
    name: ubuntu-26.04 (OpenSSL 4.0)
    runs-on: ubuntu-26.04
    env:
      OPENSSL_VERSION: 4.0.2
      OPENSSL_SHA256: 736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8
      OPENSSL_DIR: ${{ github.workspace }}/.openssl-4
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl libjson-c-dev

      - name: Install libqoriq-rcw
        run: |
          sudo apt-get install -y git meson ninja-build pkg-config libmcpp-dev
          git clone --depth 1 --branch "$LIBQORIQ_RCW_REF" https://github.com/vjardin/libqoriq-rcw "$RUNNER_TEMP/libqoriq-rcw"
          meson setup "$RUNNER_TEMP/libqoriq-rcw/build" "$RUNNER_TEMP/libqoriq-rcw" --prefix=/usr/local --libdir=lib -Dtests=false -Dman=disabled
          sudo meson install -C "$RUNNER_TEMP/libqoriq-rcw/build"
          sudo ldconfig

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v6
        with:
          path: ${{ env.OPENSSL_DIR }}
          key: openssl-${{ env.OPENSSL_VERSION }}-ubuntu-26.04

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz
          echo "$OPENSSL_SHA256  openssl.tar.gz" | sha256sum -c -
          tar xzf openssl.tar.gz
          cd openssl-$OPENSSL_VERSION
          ./Configure --prefix=$OPENSSL_DIR --libdir=lib no-tests no-docs
          make -j$(nproc)
          make install_sw

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          LD_LIBRARY_PATH=$OPENSSL_DIR/lib $OPENSSL_DIR/bin/openssl version

      - name: Build
        run: |
          CFLAGS="-I$OPENSSL_DIR/include" LDFLAGS="-L$OPENSSL_DIR/lib -Wl,-rpath,$OPENSSL_DIR/lib" make
          ldd create_hdr_isbc gen_keys | grep libcrypto.so.4

      - name: Smoke test
        run: |
          PATH=$OPENSSL_DIR/bin:$PATH LD_LIBRARY_PATH=$OPENSSL_DIR/lib tests/smoke.sh

      - name: Verification test
        run: |
          PATH=$OPENSSL_DIR/bin:$PATH LD_LIBRARY_PATH=$OPENSSL_DIR/lib tests/verify.sh

  sanitizers:
    name: ubuntu-24.04 (ASan, UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libjson-c-dev

      - name: Install libqoriq-rcw
        run: |
          sudo apt-get install -y git meson ninja-build pkg-config libmcpp-dev
          git clone --depth 1 --branch "$LIBQORIQ_RCW_REF" https://github.com/vjardin/libqoriq-rcw "$RUNNER_TEMP/libqoriq-rcw"
          meson setup "$RUNNER_TEMP/libqoriq-rcw/build" "$RUNNER_TEMP/libqoriq-rcw" --prefix=/usr/local --libdir=lib -Dtests=false -Dman=disabled
          sudo meson install -C "$RUNNER_TEMP/libqoriq-rcw/build"
          sudo ldconfig

      - name: Build
        run: |
          CFLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g" \
          LDFLAGS="-fsanitize=address,undefined" make

      - name: Smoke test
        run: ASAN_OPTIONS=detect_leaks=0 tests/smoke.sh

      - name: Verification test
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 tests/verify.sh
