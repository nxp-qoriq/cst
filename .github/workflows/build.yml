name: build

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          openssl version

      - name: Build
        run: make

      - name: Smoke test
        run: tests/smoke.sh

      - name: Install
        run: |
          make install DESTDIR=$RUNNER_TEMP/inst
          ls $RUNNER_TEMP/inst/usr/bin/cst

  build-openssl1:
    name: ubuntu-20.04 (OpenSSL 1.1)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libssl-dev git
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          gcc --version | head -1
          openssl version

      - name: Build
        run: make

      - name: Smoke test
        run: tests/smoke.sh
